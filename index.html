<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBUNhCBLHR10Q5J7lrigRpL4CuPk-y6toY",
    authDomain: "artemin-land.firebaseapp.com",
    projectId: "artemin-land",
    storageBucket: "artemin-land.firebasestorage.app",
    messagingSenderId: "858600383992",
    appId: "1:858600383992:web:ac3066c19173397572220d",
    measurementId: "G-TD7QWNY8ME"
  };

  let db = null;
  try { db = getFirestore(initializeApp(firebaseConfig)); } catch (e) { console.error("Firebase init error:", e); }

  window.saveToFirestore = async function (data, retryCount = 0) {
    if (!db) return false;
    try {
      await addDoc(collection(db, "customers"), { ...data, createdAt: new Date().toISOString() });
      return true;
    } catch (e) {
      console.error("Error adding document:", e);
      if (e.code === 'permission-denied') {
        // قوانین قدیمی فایربیس فیلدهای جدید را نمی‌پذیرند؛ بدون آن‌ها دوباره تلاش کن
        const extra = ['lat', 'lng', 'instagram', 'whatsapp', 'telegram'];
        if (extra.some(k => k in data)) {
          const rest = { ...data };
          extra.forEach(k => delete rest[k]);
          const ok = await window.saveToFirestore(rest, retryCount);
          return ok ? 'partial' : false;
        }
        return false;
      }
      if (retryCount < 3) {
        await new Promise(r => setTimeout(r, 1000));
        return window.saveToFirestore(data, retryCount + 1);
      }
      return false;
    }
  };
</script>

const T = () => translations[currentLang];

// ---------- ابزارهای عمومی ----------
function showStatus(message, type) {
  const el = $('status-msg');
  el.textContent = message;
  el.className = 'status-msg ' + type;
  el.style.display = 'block';
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => { el.style.display = 'none'; }, 5000);
}
function catLabel(c) {
  if (!c) return T().noCategory;
  return CAT_KEYS[c] ? T()[CAT_KEYS[c]] : c;
}
function mk(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}
// فقط فیلدهایی که قوانین فایربیس اجازه می‌دهد
function cloudPayload(c) {
  const keys = ['name', 'phones', 'title', 'description', 'address', 'category', 'type', 'registerGoogle', 'registerNeshan', 'hasPhoto', 'lat', 'lng', 'instagram', 'whatsapp', 'telegram'];
  const out = {};
  keys.forEach(k => { if (c[k] !== undefined && c[k] !== null) out[k] = c[k]; });
  return out;
}
async function sendToCloud(card) {
  if (typeof window.saveToFirestore !== 'function') return false;
  try {
    return await Promise.race([
      window.saveToFirestore(cloudPayload(card)),
      new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout')), 10000))
    ]);
  } catch (e) { console.warn(e); return false; }
}

function handlePhotoUpload(event) {

  reader.onload = e => {

// ---------- موقعیت ----------
async function getLocation() {
  const btn = $('locationBtn');
  const successMsg = $('locationSuccess');
  const t = T();
  const resetBtn = () => { btn.disabled = false; btn.innerHTML = '📍 <span id="btn-location-text">' + T().btnLocation + '</span>'; };

  btn.disabled = true;
  btn.textContent = '📍 ' + t.detecting;
  successMsg.style.display = 'none';
  if (!navigator.geolocation) { alert(t.locationNotSupported); resetBtn(); return; }

  try {
    const position = await new Promise((resolve, reject) =>
      navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }));
    const lat = +position.coords.latitude.toFixed(6), lng = +position.coords.longitude.toFixed(6);
    currentCoords = { lat, lng };          // مختصات همین‌جا ذخیره می‌شود حتی اگر نام خیابان پیدا نشود
    btn.textContent = t.detectingAddress;
    try {
      const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=fa,en`);
      const data = await response.json();
      if (data && data.display_name) $('address').value = data.display_name;
    } catch (e) { /* آدرس متنی دستی وارد شود، مختصات ثبت شده است */ }
    successMsg.textContent = t.locationSuccess;
    successMsg.style.display = 'block';
    setTimeout(() => { successMsg.style.display = 'none'; }, 4000);
  } catch (error) {
    try {
      btn.textContent = t.ipLocation;
      const ip = await (await fetch('https://ipwho.is/')).json();
      if (ip && ip.success !== false && ip.city) {
        $('address').value = `${ip.city}, ${ip.region}, ${ip.country}`;
        successMsg.textContent = t.ipSuccess;
        successMsg.style.display = 'block';
        setTimeout(() => { successMsg.style.display = 'none'; }, 4000);
      } else throw new Error('IP location failed');
    } catch (ipError) { alert(t.locationError); }
  }
  resetBtn();
}
// اگر آدرس را دستی عوض کرد، مختصات قبلی دیگر معتبر نیست
$('address').addEventListener('input', () => { currentCoords = null; });

// ---------- ساخت کارت ----------
$('form').addEventListener('submit', function (e) {
  e.preventDefault();
  const t = T();
  const name = $('name').value.trim();
  const phones = [...document.querySelectorAll('.phone-input')].map(i => AL.normDigits(i.value)).filter(Boolean);
  if (!name || phones.length === 0) { alert(t.alertFill); return; }

  const igRaw = $('instagram').value.trim(), waRaw = $('whatsapp').value.trim(), tgRaw = $('telegram').value.trim();
  const instagram = AL.normInstagram(igRaw), whatsapp = AL.normWhatsapp(waRaw), telegram = AL.normTelegram(tgRaw);
  if ((igRaw && !instagram) || (waRaw && !whatsapp) || (tgRaw && !telegram)) { alert(t.invalidSocial); return; }

  const card = {
    name, phones,
    title: $('title-field').value.trim(),
    description: $('description').value.trim(),
    address: $('address').value.trim(),
    category: $('category').value,
    type: currentType,
    registerGoogle: $('check-google').checked,
    registerNeshan: $('check-neshan').checked,
    hasPhoto: !!photoBase64
  };
  if (currentCoords) { card.lat = currentCoords.lat; card.lng = currentCoords.lng; }
  if (instagram) card.instagram = instagram;
  if (whatsapp) card.whatsapp = whatsapp;
  if (telegram) card.telegram = telegram;
  lastFormData = card;
  cloudSaved = false;

  $('qr-main').src = AL.qrDataUrl(AL.buildVCard(card), 512);
  $('qr-creator').src = AL.qrDataUrl(AL.CREATOR_VCARD, 512);

  let info = `<p><strong>${t.name}:</strong> ${esc(name)}</p>`;
  info += `<p><strong>${t.type}:</strong> ${card.type === 'business' ? t.business : t.personal}</p>`;
  info += `<p><strong>${t.phone}:</strong> <span dir="ltr">${esc(phones.join(' - '))}</span></p>`;
  if (card.category) info += `<p><strong>${t.category}:</strong> ${esc(catLabel(card.category))}</p>`;
  if (card.title) info += `<p><strong>${t.title}:</strong> ${esc(card.title)}</p>`;
  if (card.description) info += `<p><strong>${t.description}:</strong> ${esc(card.description)}</p>`;
  if (card.address) info += `<p><strong>${t.address}:</strong> ${esc(card.address)}</p>`;
  if (AL.hasCoords(card)) info += `<p><strong>${t.coords}:</strong> <span dir="ltr">${card.lat}, ${card.lng}</span></p>`;
  AL.socialLinks(card).forEach(s => { info += `<p><strong>${s.label}:</strong> <a href="${esc(s.url)}" target="_blank" rel="noopener" dir="ltr">${esc(s.value)}</a></p>`; });
  $('info-main').innerHTML = info;

  $('info-creator').innerHTML =
    `<p><strong>${t.name}:</strong> ${t.creatorName}</p>` +
    `<p><strong>${t.title}:</strong> ${t.creatorTitle}</p>` +
    `<p><strong>${t.phone}:</strong> ${t.creatorPhones}</p>` +
    `<p><strong>${t.address}:</strong> ${t.creatorAddress}</p>`;

  $('btn-google-maps').style.display = card.registerGoogle ? 'block' : 'none';
  $('btn-neshan-map').style.display = card.registerNeshan ? 'block' : 'none';
  $('map-section').style.display = (card.registerGoogle || card.registerNeshan) ? 'block' : 'none';

  refreshActionButtons();
  $('result').style.display = 'block';
  $('result').scrollIntoView({ behavior: 'smooth' });
});

function refreshActionButtons() {
  const t = T();
  const cb = $('btn-save-cloud'), pb = $('btn-save-phone');
  cb.textContent = cloudSaved ? t.btnSaveCloudDone : t.btnSaveCloud;
  cb.disabled = cloudSaved;
  pb.textContent = (lastFormData && lastFormData._phoneSaved) ? t.btnSavePhoneDone : t.btnSavePhone;
}

function resetForm() {
  $('form').reset();
  $('phones-container').innerHTML = '<div class="phone-row"><input type="tel" class="phone-input" inputmode="tel" placeholder="09153136173"></div>';
  $('photo-preview').style.display = 'none';
  $('photo-hint').style.display = 'block';
  photoBase64 = '';
  currentCoords = null;
  lastFormData = null;
  cloudSaved = false;

  setType(currentType);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---------- ذخیره: ابر / گوشی / مخاطبین ----------
async function saveCloud() {
  if (!lastFormData || cloudSaved) return;
  showStatus(T().saving, 'success');
  $('btn-save-cloud').disabled = true;
  const ok = await sendToCloud(lastFormData);
  cloudSaved = !!ok;
  showStatus(ok === 'partial' ? T().savedPartial : (ok ? T().savedCloud : T().saveCloudFailed), ok === true ? 'success' : 'error');
  refreshActionButtons();
  if (!ok) $('btn-save-cloud').disabled = false;
}

function loadLocal() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; }
}
function storeLocal(list) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
}
function saveToPhone() {
  if (!lastFormData) return;
  const list = loadLocal();
  const { _phoneSaved, ...card } = lastFormData;
  const same = list.findIndex(c => c.name === card.name && (c.phones || [])[0] === card.phones[0]);
  const item = { id: same >= 0 ? list[same].id : Date.now().toString(36), ...card, savedAt: new Date().toISOString() };
  if (same >= 0) list[same] = item; else list.unshift(item);
  const ok = storeLocal(list);
  if (ok) lastFormData._phoneSaved = true;
  showStatus(ok ? T().savedPhoneMsg : T().saveCloudFailed, ok ? 'success' : 'error');
  refreshActionButtons();
}

function addContact() {
  if (!lastFormData) return;
  AL.downloadText('Contact-' + AL.safeName(lastFormData.name) + '.vcf', AL.buildVCard(lastFormData) + '\r\n', 'text/vcard;charset=utf-8');
  showStatus(T().contactDone, 'success');
}

async function shareCard() {
  if (!lastFormData) return;
  const c = lastFormData;
  const text = [c.name, c.title, (c.phones || []).join(' - '), c.address, AL.hasCoords(c) ? AL.googleLink(c.lat, c.lng) : '', ...AL.socialLinks(c).map(s => s.url)]
    .filter(Boolean).join('\n');
  try {
    const blob = await (await fetch($('qr-main').src)).blob();
    const file = new File([blob], 'ArteminLand-QR.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: c.name, text });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

function downloadQR(elementId, filename) {
  const img = $(elementId);
  if (!img.src) { alert(T().noQR); return; }
  if (img.src.startsWith('data:')) { AL.downloadDataUrl(img.src, 'ArteminLand-' + filename + '.png'); return; }
  fetch(img.src).then(r => r.blob()).then(b => AL.downloadBlob(b, 'ArteminLand-' + filename + '.png')).catch(() => window.open(img.src, '_blank'));
}

function downloadCurrentData() {
  if (!lastFormData) return;
  const { _phoneSaved, ...data } = lastFormData;
  AL.downloadText(`ArteminLand-${AL.safeName(data.name)}-${Date.now()}.json`,
    JSON.stringify({ ...data, exportedAt: new Date().toISOString() }, null, 2), 'application/json');
}

// ---------- لیست ذخیره‌شده در گوشی ----------
function getSavedView() {
  const all = loadLocal();
  const f = $('saved-filter').value || '__all__';
  return f === '__all__' ? all : all.filter(c => (c.category || '') === f);
}

function renderSaved() {
  const t = T();
  const all = loadLocal();
  const sel = $('saved-filter');
  const prev = sel.value || '__all__';
  const cats = [...new Set(all.map(c => c.category || ''))];

  sel.innerHTML = '';
  const add = (v, l) => { const o = document.createElement('option'); o.value = v; o.textContent = l; sel.appendChild(o); };
  add('__all__', `${t.filterAll} (${all.length})`);
  cats.forEach(c => add(c, `${catLabel(c)} (${all.filter(x => (x.category || '') === c).length})`));
  sel.value = [...sel.options].some(o => o.value === prev) ? prev : '__all__';

  const box = $('saved-list');
  box.innerHTML = '';
  const view = getSavedView();
  if (!view.length) { box.appendChild(mk('div', 'empty-list', t.emptySaved)); return; }

  const shownCats = [...new Set(view.map(c => c.category || ''))];
  shownCats.forEach(cat => {
    const group = view.filter(c => (c.category || '') === cat);

    const head = mk('div', 'cat-head');
    head.appendChild(mk('span', '', `${catLabel(cat)} (${group.length})`));
    const vb = mk('button', 'btn-blue', t.vcfCategory);
    vb.type = 'button';
    vb.addEventListener('click', () => AL.downloadText('Artemin-' + AL.safeName(catLabel(cat)) + '.vcf', AL.vcardsFile(group), 'text/vcard;charset=utf-8'));
    head.appendChild(vb);
    box.appendChild(head);

    group.forEach(c => {
      const item = mk('div', 'saved-item');
      item.appendChild(mk('h4', '', c.name));
      const ph = mk('p', 'ltr', (c.phones || []).join(' - '));
      item.appendChild(ph);
      if (c.title) item.appendChild(mk('p', '', c.title));
      if (c.address) item.appendChild(mk('p', '', c.address));
      const soc = AL.socialLinks(c);
      if (soc.length) {
        const sp = mk('p', 'ltr');
        soc.forEach((s, i) => {
          if (i) sp.appendChild(document.createTextNode(' · '));
          const a = document.createElement('a');
          a.href = s.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = s.label;
          sp.appendChild(a);
        });
        item.appendChild(sp);
      }

      const row = mk('div', 'row');
      const btn = (label, cls, fn) => { const b = mk('button', cls, label); b.type = 'button'; b.addEventListener('click', fn); row.appendChild(b); return b; };
      btn(t.btnQr, 'btn-blue', () => showQrModal(c));
      btn(t.btnVcf, 'btn-blue', () => AL.downloadText('Contact-' + AL.safeName(c.name) + '.vcf', AL.buildVCard(c) + '\r\n', 'text/vcard;charset=utf-8'));
      const cb = btn(t.btnToCloud, 'btn-teal', async () => {
        cb.disabled = true;
        const ok = await sendToCloud(c);
        cb.textContent = ok ? '✅' : T().btnToCloud;
        cb.disabled = ok;
        if (!ok) alert(T().saveCloudFailed); else if (ok === 'partial') alert(T().savedPartial);
      });
      btn(t.btnDelete, 'btn-red', () => {
        if (!confirm(T().confirmDelete)) return;
        storeLocal(loadLocal().filter(x => x.id !== c.id));
        renderSaved();
      });
      item.appendChild(row);
      box.appendChild(item);
    });
  });
}

function exportSaved(kind) {
  const list = getSavedView();
  if (!list.length) return;
  const stamp = Date.now();
  if (kind === 'vcf') AL.downloadText(`Artemin-contacts-${stamp}.vcf`, AL.vcardsFile(list), 'text/vcard;charset=utf-8');
  else if (kind === 'csv') AL.downloadText(`Artemin-cards-${stamp}.csv`, AL.toCsv(list), 'text/csv;charset=utf-8');
  else AL.downloadText(`Artemin-cards-${stamp}.json`, JSON.stringify({ exportedAt: new Date().toISOString(), total: list.length, cards: list }, null, 2), 'application/json');
}

function showQrModal(card) {
  const url = AL.qrDataUrl(AL.buildVCard(card), 512);
  $('qrModal-name').textContent = card.name;
  $('qrModal-img').src = url;
  $('qrModal-download').onclick = () => {
    if (url.startsWith('data:')) AL.downloadDataUrl(url, 'QR-' + AL.safeName(card.name) + '.png');
    else window.open(url, '_blank');
  };
  $('qrModal').classList.add('active');
}
$('qrModal').addEventListener('click', e => { if (e.target === $('qrModal')) $('qrModal').classList.remove('active'); });

// ---------- ثبت در نقشه ----------
let currentMapType = 'google';

function mapFields() {
  const t = T(), c = lastFormData || {};
  return [
    { label: t.name, value: c.name },
    { label: t.category, value: c.category ? catLabel(c.category).replace(/^[^\p{L}\p{N}]+/u, '') : '' },
    { label: t.address, value: c.address },
    { label: t.phone, value: (c.phones || []).join(' - ') },
    { label: t.title, value: c.title },
    { label: t.description, value: c.description },
    { label: t.coords, value: AL.hasCoords(c) ? `${c.lat}, ${c.lng}` : '' }
  ].filter(f => f.value);
}

function openMapModal(mapType) {
  currentMapType = mapType;
  const t = T();
  $('modal-title').textContent = mapType === 'google' ? t.modalTitleGoogle : t.modalTitleNeshan;
  $('modal-guide').innerHTML = mapType === 'google' ? t.guideGoogle : t.guideNeshan;

  const box = $('modal-fields');
  box.innerHTML = '';
  mapFields().forEach(f => {
    const row = mk('div', 'modal-field-row');
    const info = mk('div', 'modal-field-info');
    info.appendChild(mk('div', 'modal-field-label', f.label));
    const val = mk('div', 'modal-field-value', f.value);
    val.dir = AL.detectDir(f.value);
    info.appendChild(val);

    const b = mk('button', 'btn-copy-field', t.copyBtn);
    b.type = 'button';
    b.addEventListener('click', async () => {
      await copyText(f.value);
      b.textContent = '✅ ' + T().copied;
      b.classList.add('copied');
      setTimeout(() => { b.textContent = T().copyBtn; b.classList.remove('copied'); }, 2000);
    });
    row.append(info, b);
    box.appendChild(row);
  });

  $('btn-open-google').style.display = mapType === 'google' ? 'block' : 'none';
  $('btn-open-neshan').style.display = mapType === 'neshan' ? 'block' : 'none';
  $('mapModal').classList.add('active');
}
function closeModal() { $('mapModal').classList.remove('active'); }
$('mapModal').addEventListener('click', e => { if (e.target === $('mapModal')) closeModal(); });

function allInfoText() {
  return mapFields().map(f => `${f.label}: ${f.value}`).join('\n');
}
async function copyAllInfo() {
  await copyText(allInfoText());
  alert(T().allInfoCopied);
}

// دکمه‌های باز کردن نقشه: اطلاعات را خودکار کپی می‌کنند و نقشه را روی نقطه دقیق باز می‌کنند
async function openGoogleMaps() {
  const c = lastFormData || {};
  await copyText(allInfoText());
  if (AL.hasCoords(c)) {
    if (/Android/i.test(navigator.userAgent)) {
      window.location.href = `geo:${c.lat},${c.lng}?q=${c.lat},${c.lng}(${encodeURIComponent(c.name || '')})`;
    } else {
      window.open(AL.googleLink(c.lat, c.lng), '_blank');
    }
  } else {
    const q = encodeURIComponent(((c.name || '') + ' ' + (c.address || '')).trim());
    if (/Android/i.test(navigator.userAgent)) window.location.href = `geo:0,0?q=${q}`;
    else window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, '_blank');
  }
  closeModal();
}
async function openNeshan() {
  const c = lastFormData || {};
  await copyText(allInfoText());
  const q = encodeURIComponent(((c.name || '') + ' ' + (c.address || '')).trim());
  window.open(`https://nshn.ir/?q=${q}`, '_blank');
  closeModal();
}

// ---------- PWA ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed:', err)));
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  $('installBanner').style.display = 'block';
});
function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => { deferredPrompt = null; $('installBanner').style.display = 'none'; });
}

setLang('fa');
</script>
